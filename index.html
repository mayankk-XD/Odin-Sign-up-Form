<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Asgard-Sign-up-Form</title>
</head>
<body>
    <div class="main">
        <div class="image">
            <img src="images/thorkahathora.jpg" height="100%" width="100%">
            <img src="images/odin-lined.png" alt="Asgard logo">
            <p>ASGARD</p>
            <p>ENTER THE REALM</p>
        </div>

        <div class="formSection">
            <div class="message">
                <P>This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up <em>now</em> to get started.</P>
                <p>You <em>know</em> you want to.</p>
            </div>

            <div class="form">
                <form action="#" method="post" id="signupForm">
                    <h2>Less gooo!!!</h2>

                    <div>
                        <label for="firstName">FIRST NAME</label>
                        <input type="text" name="firstName" id="firstName" required>
                    </div>

                    <div>
                        <label for="lastName">LAST NAME</label>
                        <input type="text" name="lastName" id="lastName" required>
                    </div>

                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <div>
                        <label for="phoneNumber">PHONE NUMBER</label>
                        <input type="tel" name="phoneNumber" id="phoneNumber" required>
                    </div>

                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password" required>
                    </div>

                    <div>
                        <label for="cnfPassword">CONFIRM PASSWORD</label>
                        <input type="password" name="cnfPassword" id="cnfPassword" required>
                    </div>
                </form>
            </div>

            <div class="submitSection">
                <button type="submit" form="signupForm">Submit</button>
                <p>Already have an account ?<span>Log in</span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
